<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ISTEC Business School · DBA典礼打卡文案工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#59ad2b;--green-dark:#438c20;--green-pale:#eef7e9;
  --charcoal:#292a2c;--ink:#17191c;--ink-2:#454a50;--muted:#777d83;
  --wine:#7d263d;--line:#e5e7e6;--paper:#fff;--soft:#f5f6f4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--soft);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit}
.app{max-width:430px;min-height:100vh;margin:0 auto;background:var(--paper);box-shadow:0 0 54px rgba(25,32,24,.09);overflow:hidden}
.header{height:92px;padding:15px 22px;display:flex;align-items:center;background:#fff;border-top:5px solid var(--green);border-bottom:1px solid var(--line)}
.logo{display:block;width:auto;max-width:78%;height:56px;object-fit:contain}
.dba-mark{margin-left:auto;padding-left:14px;border-left:1px solid var(--line);text-align:right;color:var(--charcoal)}
.dba-mark strong{display:block;font-size:18px;line-height:1;letter-spacing:0}.dba-mark span{display:block;margin-top:5px;font-size:8px;font-weight:700;letter-spacing:1.5px;color:var(--green-dark)}
.hero{position:relative;min-height:220px;padding:30px 24px 24px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;background-image:linear-gradient(180deg,rgba(14,15,16,.12) 0%,rgba(14,15,16,.24) 42%,rgba(14,15,16,.88) 100%),url("assets/istec-ceremony-background.jpg");background-size:cover;background-position:center center;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,13,14,.38) 0%,rgba(12,13,14,.06) 68%);pointer-events:none}
.hero:after{content:"";position:absolute;left:0;bottom:0;width:100%;height:5px;background:linear-gradient(90deg,var(--green) 0 70%,var(--wine) 70%)}
.hero-kicker{position:relative;font-size:10px;font-weight:700;letter-spacing:2.2px;color:#a8dc8d}
.hero h1{position:relative;margin:8px 0 7px;font-family:"Noto Serif SC",serif;font-size:26px;line-height:1.2;letter-spacing:0;text-shadow:0 2px 16px rgba(0,0,0,.42)}
.hero p{position:relative;margin:0;max-width:300px;font-size:11px;line-height:1.65;color:rgba(255,255,255,.82);text-shadow:0 1px 8px rgba(0,0,0,.45)}
.section{padding:22px 22px 4px}.section-head{margin-bottom:14px}.section-title{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--ink-2)}
.step{width:21px;height:21px;display:inline-flex;align-items:center;justify-content:center;background:var(--green);color:#fff;font-size:11px;font-weight:800}
.hint{display:block;margin:6px 0 0 31px;font-size:9px;font-weight:700;letter-spacing:2px;color:var(--muted)}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-card{position:relative;min-height:92px;padding:17px 15px;text-align:left;background:#fff;border:1.5px solid var(--line);cursor:pointer;overflow:hidden;transition:.22s}
.mode-card:active,.prog:active,.submit:active,.copy-btn:active{transform:scale(.98)}
.mode-card .title{display:block;font-family:"Noto Serif SC",serif;font-size:19px;font-weight:900}.mode-card .meta{display:block;margin-top:7px;font-size:10px;color:var(--muted)}
.mode-card:after{content:"";position:absolute;left:0;bottom:0;width:0;height:4px;background:var(--green);transition:.28s}
.mode-card.active{border-color:var(--green);background:var(--green-pale)}.mode-card.active .title{color:var(--green-dark)}.mode-card.active:after{width:100%}
.mode-card.active.graduation{border-color:var(--wine);background:#fbf1f4}.mode-card.active.graduation .title{color:var(--wine)}.mode-card.active.graduation:after{background:var(--wine)}
.prog-grid{display:grid;grid-template-columns:1fr;gap:10px}
.prog{position:relative;min-height:82px;min-width:0;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:1.5px solid var(--line);cursor:pointer;transition:.2s}
.prog .code{width:38px;height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--green);color:var(--green-dark);font-size:10px;font-weight:800}
.prog .meta-wrap{min-width:0}.prog .name{display:block;font-size:13px;font-weight:800;line-height:1.25}.prog .desc{display:block;margin-top:4px;font-size:8.5px;line-height:1.35;color:var(--muted);overflow-wrap:anywhere}
.prog.selected{border-color:var(--green);background:var(--green-pale)}.prog.selected .code{color:#fff;background:var(--green)}.prog.selected:after{content:"✓";position:absolute;top:6px;right:8px;color:var(--green-dark);font-size:11px;font-weight:800}
body.mode-graduation .prog.selected{border-color:var(--wine);background:#fbf1f4}body.mode-graduation .prog.selected .code{border-color:var(--wine);background:var(--wine)}body.mode-graduation .prog.selected:after{color:var(--wine)}
.submit-wrap{padding:22px 22px 0}.submit,.copy-btn{width:100%;border:0;color:#fff;background:var(--charcoal);font-weight:700;letter-spacing:1px;cursor:pointer;transition:.2s}.submit{height:52px;font-size:14px}.submit:disabled{opacity:.5;cursor:not-allowed}.submit.opening{background:var(--green-dark)}.submit.graduation{background:var(--wine)}
.output-wrap{padding:24px 22px 0}.output-card{border:1.5px solid var(--line);background:#fff}.output-accent{height:5px;background:var(--green)}body.mode-graduation .output-accent{background:var(--wine)}
.output-head{padding:13px 15px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed var(--line)}.output-label{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--green-dark)}body.mode-graduation .output-label{color:var(--wine)}.seal{font-size:9px;color:var(--muted)}
.output-body{max-height:390px;padding:16px;overflow-y:auto;font-size:13.5px;line-height:1.78;user-select:text}.first-line{margin-bottom:13px;padding-left:10px;border-left:3px solid var(--green);font-family:"Noto Serif SC",serif;font-size:15px;font-weight:900;line-height:1.45}body.mode-graduation .first-line{border-color:var(--wine)}.output-body p{margin:0 0 10px}.tag{display:inline-block;margin-right:6px;color:var(--green-dark);font-size:12px;font-weight:600}body.mode-graduation .tag{color:var(--wine)}
.output-footer{padding:12px 15px 15px;background:var(--soft);border-top:1px solid var(--line)}.copy-btn{height:46px;font-size:13px}.copy-btn.opening{background:var(--green-dark)}.copy-btn.graduation{background:var(--wine)}
.loading{padding:38px 18px;text-align:center;color:var(--muted);font-size:11px;letter-spacing:1px}.spinner{width:32px;height:32px;margin:0 auto 14px;border:2.5px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .85s linear infinite}body.mode-graduation .spinner{border-top-color:var(--wine)}@keyframes spin{to{transform:rotate(360deg)}}
.foot{padding:27px 22px 31px;text-align:center}.foot-line{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:9px;font-weight:700;letter-spacing:2px}.foot-line:before,.foot-line:after{content:"";height:1px;flex:1;background:var(--line)}.official{margin-top:13px;color:var(--green-dark);font-size:10px;font-weight:800;letter-spacing:1.4px}
.toast{position:fixed;left:50%;bottom:30px;z-index:10;transform:translate(-50%,18px);opacity:0;pointer-events:none;padding:12px 18px;border-left:3px solid var(--green);background:var(--charcoal);color:#fff;font-size:12px;font-weight:600;transition:.3s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{border-color:#d55468}.hidden{display:none!important}.reveal{animation:reveal .4s ease}@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:350px){.header{padding-inline:16px}.section,.submit-wrap,.output-wrap{padding-left:16px;padding-right:16px}.hero{padding-inline:18px}}
</style>
</head>
<body class="mode-none">
<main class="app">
  <header class="header">
    <img class="logo" src="assets/istec-logo.png" alt="ISTEC Business School Paris">
    <div class="dba-mark"><strong>DBA</strong><span>DOCTORATE</span></div>
  </header>

  <section class="hero">
    <div class="hero-kicker">ISTEC BUSINESS SCHOOL</div>
    <h1>工商管理博士<br>典礼打卡</h1>
    <p>Doctorate of Business Administration<br>记录属于博士学习者的重要时刻</p>
  </section>

  <section class="section">
    <div class="section-head">
      <div class="section-title"><span class="step">1</span><span>选择典礼场景</span></div>
      <span class="hint">CÉRÉMONIE</span>
    </div>
    <div class="mode-grid">
      <button class="mode-card" id="mode-opening" onclick="setMode('opening')"><span class="title">开学典礼</span><span class="meta">博士启程 · 入学打卡</span></button>
      <button class="mode-card" id="mode-graduation" onclick="setMode('graduation')"><span class="title">毕业典礼</span><span class="meta">高光时刻 · 荣耀加冕</span></button>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <div class="section-title"><span class="step">2</span><span>选择您的专业方向</span></div>
      <span class="hint">SPECIALISATION</span>
    </div>
    <div class="prog-grid">
      <button class="prog selected" id="prog-CI" onclick="selectProgram('CI')"><span class="code">CI</span><span class="meta-wrap"><span class="name">企业创新</span><span class="desc">Corporate Innovation</span></span></button>
      <button class="prog" id="prog-HM" onclick="selectProgram('HM')"><span class="code">HM</span><span class="meta-wrap"><span class="name">医疗健康管理</span><span class="desc">Healthcare Management</span></span></button>
      <button class="prog" id="prog-AP" onclick="selectProgram('AP')"><span class="code">AP</span><span class="meta-wrap"><span class="name">应用心理学</span><span class="desc">Applied Psychology</span></span></button>
    </div>
  </section>

  <div class="submit-wrap"><button class="submit" id="submit" disabled onclick="generateContent()"><span id="submit-text">请先选择上方的典礼场景</span> &nbsp;→</button></div>

  <section class="output-wrap hidden" id="output-wrap">
    <div class="section-head"><div class="section-title"><span class="step">3</span><span>专属打卡文案</span></div><span class="hint">CONTENU</span></div>
    <div class="output-card">
      <div class="output-accent"></div>
      <div class="output-head"><span class="output-label" id="output-label">ISTEC DBA 开学打卡</span><span class="seal">ISTEC · DBA</span></div>
      <div class="output-body" id="content-container"></div>
      <div class="output-footer"><button class="copy-btn" id="copy-btn" onclick="copyContent()">一键复制 · 去小红书发布 &nbsp;→</button></div>
    </div>
  </section>

  <footer class="foot"><div class="foot-line">ISTEC · BUSINESS SCHOOL</div><div class="official">工商管理博士 DBA</div></footer>
</main>
<div class="toast" id="toast">复制成功</div>

<script>
const PROGRAMS = ['CI','HM','AP'];
let currentMode = null;
let currentProgram = 'CI';
let isGenerating = false;

function setMode(mode){
  if(isGenerating) return;
  currentMode = mode;
  document.querySelectorAll('.mode-card').forEach(el=>el.classList.remove('active','opening','graduation'));
  document.body.className = 'mode-' + mode;
  const active = document.getElementById('mode-' + mode);
  active.classList.add('active', mode);
  const submit = document.getElementById('submit');
  submit.disabled = false;
  submit.className = 'submit ' + mode;
  document.getElementById('submit-text').textContent = mode === 'opening' ? '生成开学打卡文案' : '生成毕业打卡文案';
  document.getElementById('output-label').textContent = mode === 'opening' ? 'ISTEC DBA 开学打卡' : 'ISTEC DBA 毕业打卡';
}

function selectProgram(program){
  if(isGenerating) return;
  currentProgram = program;
  PROGRAMS.forEach(key=>document.getElementById('prog-' + key).classList.toggle('selected', key === program));
}

async function generateContent(){
  if(isGenerating || !currentMode) return;
  isGenerating = true;
  const wrap = document.getElementById('output-wrap');
  const container = document.getElementById('content-container');
  const submit = document.getElementById('submit');
  const submitText = document.getElementById('submit-text');
  submit.disabled = true;
  submitText.textContent = '文案生成中...';
  wrap.classList.remove('hidden');
  wrap.classList.add('reveal');
  container.innerHTML = '<div class="loading"><div class="spinner"></div>ISTEC DBA 打卡文案 · 定制生成中</div>';
  setTimeout(()=>wrap.scrollIntoView({behavior:'smooth',block:'start'}),80);

  try{
    if(location.protocol === 'file:') throw new Error('请通过本地服务器打开网站');
    const response = await fetch('/api/generate',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({mode:currentMode,program:currentProgram})
    });
    const data = await response.json().catch(()=>({}));
    if(!response.ok || !data.content) throw new Error(data.message || '生成服务暂时不可用');
    renderContent(data.content);
  }catch(error){
    container.innerHTML = '<p style="margin:0;color:#7d263d">' + escapeHtml(error.message) + '，请稍后重试。</p>';
    showToast('生成失败，请稍后重试','err');
  }finally{
    isGenerating = false;
    submit.disabled = false;
    submitText.textContent = currentMode === 'opening' ? '换一篇开学文案' : '换一篇毕业文案';
    document.getElementById('copy-btn').className = 'copy-btn ' + currentMode;
  }
}

function renderContent(content){
  const lines = String(content).split('\n');
  document.getElementById('content-container').innerHTML = lines.map((line,index)=>{
    if(index===0) return '<div class="first-line">' + escapeHtml(line) + '</div>';
    if(line.trim().startsWith('#')) return '<div>' + line.trim().split(/\s+/).map(tag=>'<span class="tag">'+escapeHtml(tag)+'</span>').join('') + '</div>';
    if(!line.trim()) return '<div style="height:4px"></div>';
    return '<p>' + escapeHtml(line) + '</p>';
  }).join('');
}

function copyContent(){
  const text = document.getElementById('content-container').innerText;
  if(!text || text.includes('请稍后重试')) return showToast('请先成功生成文案','err');
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>{showToast('复制成功 · 可粘贴至小红书','ok');trackCopyEvent()}).catch(()=>fallbackCopy(text));
  }else fallbackCopy(text);
}

function fallbackCopy(text){
  const textarea = document.createElement('textarea');
  textarea.value=text;textarea.style.position='fixed';textarea.style.left='-9999px';
  document.body.appendChild(textarea);textarea.select();
  try{if(!document.execCommand('copy')) throw new Error();showToast('复制成功','ok');trackCopyEvent()}catch(e){showToast('请手动选择文本复制','err')}
  textarea.remove();
}

function trackCopyEvent(){
  if(location.protocol==='file:') return;
  const payload=JSON.stringify({mode:currentMode,program:currentProgram,campaign:new URLSearchParams(location.search).get('campaign')||'default'});
  if(navigator.sendBeacon && navigator.sendBeacon('/api/copy-event',new Blob([payload],{type:'application/json'}))) return;
  fetch('/api/copy-event',{method:'POST',headers:{'Content-Type':'application/json'},body:payload,keepalive:true}).catch(()=>{});
}

function showToast(message,type){
  const toast=document.getElementById('toast');toast.textContent=message;toast.className='toast '+(type||'');toast.classList.add('show');
  clearTimeout(toast._timer);toast._timer=setTimeout(()=>toast.classList.remove('show'),2600);
}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
selectProgram('CI');
</script>
</body>
</html>
